name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crykit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    needs: build
    if: github.event.repository.private == false
    name: verify (${{ matrix.check.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: checks, script: 'check:deterministic:base' }
          - { name: unit, script: 'test:unit' }
          - { name: dom, script: 'test:dom' }
          # Separate runners retain fixture isolation and serial pools within the existing job deadline
          # The complete sync journey file owns a runner so unrelated files cannot consume its deadline
          - { name: 'persistence sync', script: 'test:persistence -- src/persistence/sync-integration.test.ts' }
          - { name: 'persistence 1/6', script: 'test:persistence -- --exclude=src/persistence/sync-integration.test.ts --shard=1/6' }
          - { name: 'persistence 2/6', script: 'test:persistence -- --exclude=src/persistence/sync-integration.test.ts --shard=2/6' }
          - { name: 'persistence 3/6', script: 'test:persistence -- --exclude=src/persistence/sync-integration.test.ts --shard=3/6' }
          - { name: 'persistence 4/6', script: 'test:persistence -- --exclude=src/persistence/sync-integration.test.ts --shard=4/6' }
          - { name: 'persistence 5/6', script: 'test:persistence -- --exclude=src/persistence/sync-integration.test.ts --shard=5/6' }
          - { name: 'persistence 6/6', script: 'test:persistence -- --exclude=src/persistence/sync-integration.test.ts --shard=6/6' }
          - { name: 'worker 1/6', script: 'test:worker -- --shard=1/6' }
          - { name: 'worker 2/6', script: 'test:worker -- --shard=2/6' }
          - { name: 'worker 3/6', script: 'test:worker -- --shard=3/6' }
          - { name: 'worker 4/6', script: 'test:worker -- --shard=4/6' }
          - { name: 'worker 5/6', script: 'test:worker -- --shard=5/6' }
          - { name: 'worker 6/6', script: 'test:worker -- --shard=6/6' }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install native recovery test browser
        if: startsWith(matrix.check.name, 'worker ')
        run: |
          # The Azure apt mirror can stall on hosted runners before Playwright installs its browsers
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99playwright-network > /dev/null
          npx playwright install --with-deps chromium
      - name: Download application assets for native route checks
        if: startsWith(matrix.check.name, 'worker ')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application
          path: dist/
      - name: Verify ${{ matrix.check.name }}
        run: npm run ${{ matrix.check.script }}

  # Browsers need the built artifact; merging and deployment also require verify
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Validate deployment
        run: npm run deploy:dry-run
      - name: Save built application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application
          path: dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: build
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop, shard: 1, shards: 8 }
          - { project: desktop, shard: 2, shards: 8 }
          - { project: desktop, shard: 3, shards: 8 }
          - { project: desktop, shard: 4, shards: 8 }
          - { project: desktop, shard: 5, shards: 8 }
          - { project: desktop, shard: 6, shards: 8 }
          - { project: desktop, shard: 7, shards: 8 }
          - { project: desktop, shard: 8, shards: 8 }
          - { project: mobile, shard: 1, shards: 4 }
          - { project: mobile, shard: 2, shards: 4 }
          - { project: mobile, shard: 3, shards: 4 }
          - { project: mobile, shard: 4, shards: 4 }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download built application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application
          path: dist/
      - name: Install test browser
        run: |
          # The Azure apt mirror can stall on hosted runners before Playwright installs Chromium
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99playwright-network > /dev/null
          npx playwright install --with-deps chromium
      - name: Verify browser workflows
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=1
      - name: Save browser timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-timings-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/timings.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 1

  account-browser:
    needs: build
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download built application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application
          path: dist/
      - name: Install test browsers
        run: |
          # The Azure apt mirror can stall on hosted runners before Playwright installs its browsers
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99playwright-network > /dev/null
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify isolated account acceptance
        run: |
          npm run build:account-tests
          npm exec vite build -- --config vite.accounts.config.ts
          npm run test:e2e:accounts:prepared -- --shard=${{ matrix.shard }}/4
      - name: Save account failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-browser-failures-${{ matrix.shard }}
          # Only synthetic test evidence is included from the hidden build directory
          path: |
            .account-tests/acceptance-artifacts/
            .account-tests/acceptance-results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  release-ready:
    name: release-ready
    needs: [verify, build, browser, account-browser]
    if: always() && github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm required verification
        env:
          ACCOUNTS_RESULT: ${{ needs.account-browser.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          required_result=success
          if [ "$VERIFY_RESULT" != "$required_result" ] || [ "$BUILD_RESULT" != "$required_result" ] || [ "$BROWSER_RESULT" != "$required_result" ] || [ "$ACCOUNTS_RESULT" != "$required_result" ]; then
            echo "Required verification did not pass: verify=$VERIFY_RESULT build=$BUILD_RESULT browser=$BROWSER_RESULT accounts=$ACCOUNTS_RESULT" >&2
            exit 1
          fi

  deploy:
    needs: [verify, build]
    if: github.event.repository.private == false && github.repository == 'j-256/crykit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download verified application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application
          path: dist/
      - name: Deploy verified assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run check:assets
          WRANGLER_OUTPUT_FILE_PATH="$(mktemp "$RUNNER_TEMP/worker-upload.XXXXXX")"
          export WRANGLER_OUTPUT_FILE_PATH
          npx wrangler versions upload
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const records = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8')
            .split('\n').filter(Boolean).map(line => JSON.parse(line))
          const uploads = records.filter(record => record.type === 'version-upload')
          const upload = uploads[0]
          const versionIdPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
          if (uploads.length !== 1 || upload.version !== 1 ||
              upload.worker_name !== 'crykit' || !versionIdPattern.test(upload.version_id)) {
            throw new Error('Expected one version upload for crykit with a valid version ID')
          }
          execFileSync('node_modules/.bin/wrangler', [
            'versions', 'deploy', `${upload.version_id}@100%`, '--yes',
          ], { stdio: 'inherit' })
          JS
