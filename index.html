<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#20272c" />
    <meta name="description" content="Plan and compare builds for Crystal Project. Explore classes, skills, and gear, then track your characters, inventory, and progress with Crystal Kit." />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com/beacon.min.js; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com/cdn-cgi/rum; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>CryKit - A Crystal Project planner</title>
    <!-- Startup styling must arrive with the HTML, before any application CSS or JavaScript -->
    <!-- These scoped rules also style LoadingScreen after React takes over -->
    <!-- Repeat the theme font here so the wordmark can load before application CSS -->
    <style>
      @font-face { font-family: "Pixel Operator"; font-style: normal; font-weight: 400; font-display: swap; src: url('./src/assets/fonts/pixel-operator.woff2') format('woff2'); }
      html { background: #171d22; }
      body { margin: 0; }
      .loading-screen { box-sizing: border-box; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; background: var(--ink-950, #171d22); color: var(--text, #f1f4f5); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      .loading-screen__content { display: grid; justify-items: center; gap: 10px; width: 100%; max-width: 360px; }
      .loading-screen__crystal { display: block; margin-bottom: 14px; line-height: 0; }
      .loading-screen__crystal svg { width: 72px; height: 72px; }
      .loading-screen h1 { position: relative; width: auto; margin: 0; padding: 0; color: var(--text, #f1f4f5); font-family: "Pixel Operator", ui-monospace, monospace; font-size: clamp(36px, 10vw, 48px); font-weight: 400; line-height: 1; }
      .loading-screen h1::before, .loading-screen h1::after { content: none; }
      .loading-screen__opening { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .loading-screen .loading-screen__tagline { margin: 0; color: var(--text-dim, #c1ced4); font-size: 13px; line-height: 1.5; }
      .loading-screen .loading-screen__status { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 26px 0 0; color: var(--text-dim, #c1ced4); font-size: 13px; line-height: 1.5; }
      .loading-screen .spinner { box-sizing: border-box; display: inline-block; flex: 0 0 auto; width: 16px; height: 16px; border: 2px solid var(--line-strong, rgba(183, 205, 217, .55)); border-top-color: var(--cyan-300, #7bd8f3); border-radius: 50%; animation: loading-spin .7s linear infinite; }
      @keyframes loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .loading-screen .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Show feedback while the entry module downloads and evaluates, before React can render -->
    <div id="root">
      <main aria-busy="true" class="loading-screen">
        <div class="loading-screen__content">
          <span aria-hidden="true" class="loading-screen__crystal">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
              <g shape-rendering="crispEdges" stroke="none">
                <path d="M11 1h2v2h2v2h2v3h2v8h-2v3h-2v2h-2v2h-2v-2H9v-2H7v-3H5V8h2V5h2V3h2z" fill="#24567c"/>
                <path d="M11 3h2v2h2v3h2v7h-2v3h-2v3h-2v-3H9v-3H7V8h2V5h2z" fill="#59c7ed"/>
                <path d="M11 4h2v4h-2v8H9V8h2z" fill="#e1fcff"/>
                <path d="M13 8h4v7h-2v3h-2z" fill="#3892c5"/>
                <path d="M11 16h2v5h-2z" fill="#8cecff"/>
              </g>
            </svg>
          </span>
          <h1><span class="loading-screen__opening">Opening </span>Crystal Kit</h1>
          <p class="loading-screen__tagline">A Crystal Project planner</p>
          <p class="loading-screen__status" role="status"><span aria-hidden="true" class="spinner"></span>Loading application files...</p>
        </div>
      </main>
    </div>
    <noscript>Crystal Kit needs JavaScript to keep your records in this browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
